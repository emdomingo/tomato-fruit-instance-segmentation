# Conda environment for Mask2Former + Swin-Tiny instance segmentation
# Targets: Wolffe HPC (A100, CUDA 11.8), local dev (Windows, partial)
#
# Usage:
#   conda env create -f environment.yml
#   conda activate tomato-seg
#
# After activation, you MUST also:
#   1. Install Detectron2 from source:
#      pip install 'git+https://github.com/facebookresearch/detectron2.git'
#
#   2. Compile MSDeformAttn CUDA kernel (GPU node only):
#      cd Mask2Former/mask2former/modeling/pixel_decoder/ops
#      sh make.sh
#
#   3. Verify everything:
#      python check_dependencies.py

name: tomato-seg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=11.8
  - numpy
  - scipy
  - cython
  - pip
  - pip:
      - "setuptools<81"
      - "timm<1.0"
      - opencv-python
      - scikit-image
      - shapely
      - h5py
      - pycocotools
      - pillow
